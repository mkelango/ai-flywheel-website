    <!-- Pre-paint theme: DARK by default; opt into light via saved preference. Avoids a flash. -->

      (function () {
        try {
          if (localStorage.getItem('aif-theme') !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
