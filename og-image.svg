<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="32%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#15293F"/><stop offset="55%" stop-color="#0E1E30"/><stop offset="100%" stop-color="#0A131F"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2D49A"/><stop offset="100%" stop-color="#D9AE5E"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="46%" r="60%"><stop offset="0%" stop-color="#173049"/><stop offset="100%" stop-color="#0C1A29"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- flywheel, right side -->
  <g transform="translate(900,315)">
    <circle r="230" fill="none" stroke="#23394E" stroke-width="1.5"/>
    <g stroke="#1FA877" stroke-width="2" stroke-dasharray="2 6" opacity="0.5"><circle r="218" fill="none"/></g>
    <!-- four arcs -->
    <path d="M0,-180 A180,180 0 0 1 180,0 L78,0 A78,78 0 0 0 0,-78 Z" fill="#5E92B3" stroke="#0A131F" stroke-width="3"/>
    <path d="M180,0 A180,180 0 0 1 0,180 L0,78 A78,78 0 0 0 78,0 Z" fill="#45C3B9" stroke="#0A131F" stroke-width="3"/>
    <path d="M0,180 A180,180 0 0 1 -180,0 L-78,0 A78,78 0 0 0 0,78 Z" fill="#8E86F0" stroke="#0A131F" stroke-width="3"/>
    <path d="M-180,0 A180,180 0 0 1 0,-180 L0,-78 A78,78 0 0 0 -78,0 Z" fill="#F0A95E" stroke="#0A131F" stroke-width="3"/>
    <circle r="74" fill="url(#hub)" stroke="#E6B968" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="2" fill="#F2D49A">DRIVE</text>
  </g>
  <!-- text, left side -->
  <text x="90" y="150" font-size="17" font-weight="700" letter-spacing="5" fill="#E6B968">ENTERPRISE&#160;&#160;AI&#160;&#160;FRAMEWORK</text>
  <text x="86" y="250" font-size="84" font-weight="800" letter-spacing="-2" fill="#EEF3F8">The AI</text>
  <text x="86" y="346" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#gold)">Flywheel</text>
  <text x="90" y="410" font-size="28" fill="#9DB1C2">Turn AI into compounding value —</text>
  <text x="90" y="448" font-size="28" fill="#9DB1C2">at any scale.</text>
  <line x1="90" y1="500" x2="640" y2="500" stroke="#21384E" stroke-width="1"/>
  <text x="90" y="540" font-size="20" fill="#8FA4B6">One framework&#160;&#160;·&#160;&#160;Three scales&#160;&#160;·&#160;&#160;Four actors</text>
  <text x="90" y="572" font-size="18" font-style="italic" fill="#E6B968">Add 1. Become the one.</text>
</svg>
